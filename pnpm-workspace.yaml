allowBuilds:
  esbuild: false
  lightningcss: false
  "@vgpu/adapter-node": false
  webgpu: false
packages:
  - .
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@tanstack/devtools-vite":
    skills: false
  "@tanstack/react-router":
    skills: false
  "@tanstack/react-start":
    skills: false
